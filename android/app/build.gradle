apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Ship the JS bundle inside the debug APK so physical devices can boot
    // even when Metro is unavailable or intentionally skipped.
    debuggableVariants = ["debugOptimized"]
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = "io.github.react-native-community:jsc-android:2026004.+"
def releaseStoreFile = findProperty("MIITJEE_UPLOAD_STORE_FILE") ?: System.getenv("MIITJEE_UPLOAD_STORE_FILE")
def releaseStorePassword = findProperty("MIITJEE_UPLOAD_STORE_PASSWORD") ?: System.getenv("MIITJEE_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = findProperty("MIITJEE_UPLOAD_KEY_ALIAS") ?: System.getenv("MIITJEE_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = findProperty("MIITJEE_UPLOAD_KEY_PASSWORD") ?: System.getenv("MIITJEE_UPLOAD_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion
    namespace = "com.miitjee.digital"

    defaultConfig {
        applicationId = "com.miitjee.digital"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 8
        versionName = "1.2.0"
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release",
                          "-DCMAKE_CXX_FLAGS_RELEASE=-O0 -g0 -fno-vectorize -fno-slp-vectorize",
                          "-DCMAKE_C_FLAGS_RELEASE=-O0 -g0 -fno-vectorize -fno-slp-vectorize"
                cFlags "-O0 -fno-vectorize -fno-slp-vectorize -g0"
                cppFlags "-O0 -fno-vectorize -fno-slp-vectorize -g0"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            ndk {
                debugSymbolLevel 'NONE'
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation(jscFlavor)
    }
}
