# Project-wide Gradle settings

# Give Gradle enough heap for RN 0.84 release builds while keeping native
# compilation itself serialized to avoid Windows clang OOMs.
org.gradle.jvmargs=-Xms512m -Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx1024m

# Prefer stability over throughput for local and CI Android builds.
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.vfs.watch=false

# JAVA PATH
org.gradle.java.home=D:\\Downloads\\miitjee-mobile\\toolchains\\jdk-17.0.18+8
org.gradle.java.installations.paths=D:/Downloads/miitjee-mobile/toolchains/jdk-17.0.18+8
org.gradle.java.installations.auto-download=false

# KOTLIN (STABLE SETTINGS)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# ANDROID / RN
android.useAndroidX=true
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true


MIITJEE_UPLOAD_STORE_FILE=upload-keystore.jks
MIITJEE_UPLOAD_KEY_ALIAS=upload
MIITJEE_UPLOAD_STORE_PASSWORD=12345678
MIITJEE_UPLOAD_KEY_PASSWORD=12345678
