<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIITJEE Digital</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #F7F9FC;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #root {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: #F7F9FC;
    }

    /* ===== Sleek Custom Desktop Scrollbar ===== */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #EBF0F7;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #5B61F6;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3941D8;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #5B61F6 #EBF0F7;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.web.tsx"></script>
</body>
</html>
